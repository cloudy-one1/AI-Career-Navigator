<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试诊断报告 · 候选人分享</title>
  <!-- 分享页不索引：报告是私人内容，只是被临时分享给特定读者 -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <!-- v7.2.2: style.css 已并入 components.css；style 与 auth 无真实选择器重叠，
       合流后 auth 仍在 components 之后，层叠结果不变 -->
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/pages/auth.css">
  <link rel="stylesheet" href="/src/css/motion.css">
</head>
<body class="share-body">
  <div class="share-wrap">
    <!-- 头部：谁 / 什么岗位 / 何时 -->
    <header id="share-header" class="share-header">
      <div class="share-brand">
        <span class="share-brand-mark" aria-hidden="true">AI</span>
        <span>AI 求职陪跑 · 诊断报告</span>
      </div>
      <h1 id="share-title" class="share-title">加载中…</h1>
      <div id="share-subtitle" class="share-subtitle"></div>
      <div class="share-origin">本报告由候选人主动分享，内容已经过个人信息脱敏处理</div>
    </header>

    <main id="share-content" class="share-content"></main>

    <footer id="share-footer" class="share-footer hidden">
      <div id="share-expiry" class="share-expiry"></div>
      <div class="share-disclaimer">
        本报告由 AI 求职陪跑平台根据候选人的回答自动生成，反映其在本次模拟练习中的表现，
        <b>不构成任何录用建议</b>，也不代表候选人在真实面试中的必然表现。
      </div>
    </footer>
  </div>

  <script type="module" src="/src/share-main.js"></script>
</body>
</html>
