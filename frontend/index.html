<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI面试官 v2.7</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

<!-- Header -->
<header class="header">
  <div style="display:flex;align-items:center;gap:12px;">
    <h1>AI面试官</h1>
    <span class="version">v2.7</span>
  </div>
  <div style="font-size:.85rem;opacity:.9;">智能面试训练平台</div>
</header>

<!-- Tabs -->
<nav class="tabs">
  <button class="tab-btn active" data-tab="interview">
    <span class="tab-icon">💬</span> 面试
  </button>
  <button class="tab-btn" data-tab="report">
    <span class="tab-icon">📊</span> 报告
  </button>
  <button class="tab-btn" data-tab="history">
    <span class="tab-icon">📜</span> 历史
  </button>
  <button class="tab-btn" data-tab="question-bank">
    <span class="tab-icon">📚</span> 题库
  </button>
</nav>

<!-- Main Content -->
<main class="container">
  <section id="interview-panel" class="panel active"></section>
  <section id="report-panel" class="panel"></section>
  <section id="history-panel" class="panel"></section>
  <section id="question-bank-panel" class="panel"></section>
</main>

<script type="module" src="/js/app.js"></script>
</body>
</html>
