<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 求职领航</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <!-- v7.6 壳层布局独立成层（自 components.css 抽出）：Header/旅程侧栏/容器/进度条/底部导航 -->
  <link rel="stylesheet" href="/src/css/layout.css">
  <!-- v7.2.2 组件层合流：原 style.css 全文并入 components.css（含已剔除的 17 条死规则）。
       components 必须位于 pages/*.css 之后（承接原 style.css 的层叠位置），motion/theme 仍在其后。
       v7.6 起壳层规则（原文件头 279 行）已迁至 layout.css。 -->
  <link rel="stylesheet" href="/src/css/pages/interview.css">
  <link rel="stylesheet" href="/src/css/pages/report.css">
  <link rel="stylesheet" href="/src/css/pages/history.css">
  <link rel="stylesheet" href="/src/css/pages/market.css">
  <link rel="stylesheet" href="/src/css/pages/memory.css">
  <link rel="stylesheet" href="/src/css/pages/profile.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/motion.css">
  <link rel="stylesheet" href="/src/css/theme.css">
  <script>
    /* 防 FOUC：body 绘制前先套用已记忆的主题，避免闪白（对齐 job-crawler） */
    try { if (localStorage.getItem('theme') === 'dark') { document.documentElement.classList.add('theme-dark'); } } catch (e) {}
  </script>
</head>
<body>

<!-- 全局 Header（v4.0 框架） -->
<header class="app-header">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </span>
    <span>AI 求职领航</span>
  </div>
  <div class="header-right">
    <!-- v5.0: 页面风格切换（米色 / 深色），对齐 job-crawler -->
    <button id="theme-toggle" class="theme-toggle" type="button" title="切换页面风格（米色 / 深色）">🌙 深色风</button>
    <button id="interview-status" class="status-light hidden" type="button" aria-label="返回面试中">
      <span class="status-dot" aria-hidden="true"></span>
      <span>面试中 · 返回</span>
    </button>
  </div>
</header>

<div class="app-body">
  <!-- 侧边导航（桌面 / 平板）：v7.6 起由 navConfig.js 渲染五步旅程时间线 -->
  <nav class="app-nav" id="app-nav" role="navigation" aria-label="主导航"></nav>

  <!-- 主内容 -->
  <main class="container">
    <!-- v7.6: 旅程进度条（navConfig.js 渲染；首页等不在旅程内的页面自动隐藏） -->
    <div id="journey-progress" class="journey-progress" hidden></div>
    <!-- v8.2: 产品主页已独立为 landing.html；SPA 内默认首屏回到能力档案 -->
    <section id="home-panel" class="panel active"></section>
    <section id="interview-panel" class="panel"></section>
    <section id="report-panel" class="panel"></section>
    <section id="history-panel" class="panel"></section>
    <section id="question-bank-panel" class="panel"></section>
    <section id="career-plan-panel" class="panel"></section>
    <section id="market-data-panel" class="panel"></section>
    <section id="memory-panel" class="panel"></section>
    <!-- v7.0: 简历库 / 岗位库 -->
    <section id="resume-library-panel" class="panel"></section>
    <section id="position-library-panel" class="panel"></section>
  </main>
</div>

<!-- 移动端底部导航：v7.6 起由 navConfig.js 渲染（能力档案 + 五步旅程顺序） -->
<nav class="bottom-nav" id="bottom-nav" role="navigation" aria-label="底部导航"></nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
