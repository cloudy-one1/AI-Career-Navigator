<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI面试官与职业规划 v3.2</title>
  <link rel="stylesheet" href="/src/css/tokens.css">
  <link rel="stylesheet" href="/src/css/base.css">
  <link rel="stylesheet" href="/src/css/components.css">
  <link rel="stylesheet" href="/src/css/pages/interview.css">
  <link rel="stylesheet" href="/src/css/pages/report.css">
  <link rel="stylesheet" href="/src/css/pages/history.css">
  <link rel="stylesheet" href="/src/css/pages/dark.css">
  <link rel="stylesheet" href="/src/css/pages/market.css">
  <link rel="stylesheet" href="/src/css/pages/memory.css">
  <link rel="stylesheet" href="/src/css/pages/auth.css">
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body>

<!-- 全局 Header（v4.0 框架） -->
<header class="app-header">
  <div class="brand">
    <span class="brand-logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </span>
    <span>AI 模拟面试官</span>
    <span class="version-badge">v3.2</span>
  </div>
  <div class="header-right">
    <button id="interview-status" class="status-light hidden" type="button" aria-label="返回面试中">
      <span class="status-dot" aria-hidden="true"></span>
      <span>面试中 · 返回</span>
    </button>
    <!-- v7.0: 账户入口。不登录也能正常使用，因此这里是"状态指示"而非强制门禁。 -->
    <button id="user-btn" class="user-btn hidden" type="button" aria-label="账户">
      <span class="user-btn-avatar" aria-hidden="true">?</span>
      <span class="user-btn-label">未登录</span>
    </button>
  </div>
</header>

<div class="app-body">
  <!-- 侧边导航（桌面 / 平板） -->
  <nav class="app-nav" role="navigation" aria-label="主导航">
    <button class="nav-item active" data-tab="interview" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span class="nav-label">模拟面试</span>
    </button>
    <button class="nav-item" data-tab="report">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      <span class="nav-label">综合报告</span>
    </button>
    <button class="nav-item" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="nav-label">历史记录</span>
    </button>
    <button class="nav-item" data-tab="question-bank">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      <span class="nav-label">题库</span>
    </button>
    <button class="nav-item" data-tab="career-plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
      <span class="nav-label">职业规划</span>
    </button>
    <button class="nav-item" data-tab="market-data">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      <span class="nav-label">市场数据</span>
    </button>
    <button class="nav-item" data-tab="memory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="7" r="2"/><circle cx="19.5" cy="7" r="2"/><circle cx="4.5" cy="17" r="2"/><circle cx="19.5" cy="17" r="2"/><line x1="6.3" y1="8.2" x2="9.6" y2="10.6"/><line x1="17.7" y1="8.2" x2="14.4" y2="10.6"/><line x1="6.3" y1="15.8" x2="9.6" y2="13.4"/><line x1="17.7" y1="15.8" x2="14.4" y2="13.4"/></svg>
      <span class="nav-label">长期记忆</span>
    </button>
    <!-- v7.0: 简历库 / 岗位库（可复用输入资产） -->
    <button class="nav-item" data-tab="resume-library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="nav-label">简历库</span>
    </button>
    <button class="nav-item" data-tab="position-library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <span class="nav-label">岗位库</span>
    </button>
    <!-- v7.0.1: 招聘者收件箱（登录后按身份显示） -->
    <button class="nav-item hidden" data-tab="recruiter-inbox" data-audience="recruiter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <span class="nav-label">收到的报告</span>
    </button>
    <!-- v7.0: 账户（登录/注册） -->
    <button class="nav-item" data-tab="account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">账户</span>
    </button>
  </nav>

  <!-- 主内容 -->
  <main class="container">
    <section id="interview-panel" class="panel active"></section>
    <section id="report-panel" class="panel"></section>
    <section id="history-panel" class="panel"></section>
    <section id="question-bank-panel" class="panel"></section>
    <section id="career-plan-panel" class="panel"></section>
    <section id="market-data-panel" class="panel"></section>
    <section id="memory-panel" class="panel"></section>
    <!-- v7.0: 简历库 / 岗位库 -->
    <section id="resume-library-panel" class="panel"></section>
    <section id="position-library-panel" class="panel"></section>
    <!-- v7.0.1: 招聘者收到的报告 -->
    <section id="recruiter-inbox-panel" class="panel"></section>
    <!-- v7.0: 账户（登录/注册）面板 -->
    <section id="account-panel" class="panel"></section>
  </main>
</div>

<!-- 移动端底部导航 -->
<nav class="bottom-nav" role="navigation" aria-label="底部导航">
  <button class="nav-item active" data-tab="interview" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>面试</span>
  </button>
  <button class="nav-item" data-tab="report">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>

  <button class="nav-item" data-tab="history">

    <span>历史</span>
  </button>
  <button class="nav-item" data-tab="question-bank">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
    <span>题库</span>
  </button>
  <button class="nav-item" data-tab="career-plan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>

  <button class="nav-item" data-tab="market-data">

    <span>市场</span>
  </button>
  <button class="nav-item" data-tab="memory">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="4.5" cy="7" r="2"/><circle cx="19.5" cy="7" r="2"/><circle cx="4.5" cy="17" r="2"/><circle cx="19.5" cy="17" r="2"/><line x1="6.3" y1="8.2" x2="9.6" y2="10.6"/><line x1="17.7" y1="8.2" x2="14.4" y2="10.6"/><line x1="6.3" y1="15.8" x2="9.6" y2="13.4"/><line x1="17.7" y1="15.8" x2="14.4" y2="13.4"/></svg>
    <span>记忆</span>
  </button>
  <!-- v7.0: 简历库 / 岗位库 -->
  <button class="nav-item" data-tab="resume-library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
    <span>简历</span>
  </button>
  <button class="nav-item" data-tab="position-library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>

  </button>
  <!-- v7.0.1: 招聘者收件箱 -->
  <button class="nav-item hidden" data-tab="recruiter-inbox" data-audience="recruiter">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
    <span>收件箱</span>
  </button>
  <!-- v7.0: 账户 -->
  <button class="nav-item" data-tab="account">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

</nav>

<script type="module" src="/src/main.js"></script>
</body>
</html>
