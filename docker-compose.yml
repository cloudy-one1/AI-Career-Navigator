# ============================================================
# AI 求职领航 — Docker Compose 标准化部署
#
# ⚠️⚠️ 部署边界 —— 改这个文件前先读 ⚠️⚠️
#   本系统是单用户本地工具，全站免登录（CHARTER DC-10）：接口不含身份概念，
#   谁能连上这个端口，就能读写 ./data 下的全部简历、面试记录与题库，
#   并匿名调用 /api/voice/* 花你的云端 ASR/TTS 额度（防线只有 20/min 按 IP 限流）。
#
#   所以下面 ports 默认只发布到宿主机 127.0.0.1，即"仅本机可访问"。
#   确需扩大访问面时二选一，别直接把发布地址写成裸 0.0.0.0：
#     · 局域网临时共享 → .env 里设 BIND_ADDR=0.0.0.0，并自行用防火墙限源网段；
#     · 对外提供服务   → 放到带认证的反向代理之后（HTTPS + 访问控制），
#                       且先给 voice 路由补上鉴权（见 docs/LIMITATIONS.md）。
#
#   注意 environment 里的 HOST=0.0.0.0 不是疏漏，也不要改：那是**容器内**的监听地址，
#   只有绑 0.0.0.0 宿主机才能通过端口映射访问到它。真正的暴露面由 BIND_ADDR 决定。
#
# 使用方式:
#   1. cp .env.example .env   # 编辑 .env，填入 API KEY
#   2. docker compose up -d   # 启动
#   3. docker compose logs -f # 查看日志
#   4. docker compose down    # 停止
#
# 更新:
#   docker compose down && docker compose build --no-cache && docker compose up -d
# ============================================================

services:
  app:
    build: .
    container_name: ai-career-navigator
    restart: unless-stopped

    ports:
      # 默认只发布到宿主机回环地址（仅本机可访问）；扩大访问面见文件头「部署边界」
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8000}:8000"

    # 数据持久化：面试记录、题库、上传文件
    volumes:
      - ./data:/app/data

    # 环境变量从 .env 注入
    env_file:
      - .env

    environment:
      - HOST=0.0.0.0    # 容器内监听地址，必须保持 0.0.0.0，否则端口映射打不通
      - PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-info}

    # 资源限制（可选，按需调整）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M
    #       cpus: "1.0"

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
