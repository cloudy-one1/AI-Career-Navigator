# Dependabot：自动维护依赖（后端 pip + 前端 npm）。
#
# 口径说明：
# - requirements.txt 只声明版本下限（>=），dependabot 的更新是"放宽"而非"收紧"，
#   合入前仍需本地 `pip install -r requirements.txt` 且 CI 绿灯。
# - frontend/ 有 package-lock.json，更新 PR 会同时改 package.json 与 lockfile；
#   CI 用 `npm ci`，两者不同步会直接红灯——合入前务必确认 lockfile 已随 PR 一并更新。
# - 每周一检查一次、PR 上限 5 条，避免依赖变更一次涌入过多。
# - commit message 沿用 dependabot 默认前缀（不自定义），以免与仓库的 Commit Message
#   规范冲突。
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # openai SDK 跨 major 有 breaking change，而 backend/llm_client.py 是调用入口；
      # requirements.txt 只写下限（>=），抬高下限会让**所有新装环境**直接装到新版，
      # 风险外溢到"首次安装即崩"。major 升级需人工在本机 + CI 双验证后再手动提下限。
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # 构建链（vite）与测试链（vitest）跨 major 会改配置项与 API，
      # 涉及 vite.config.js 的入口/chunk 配置与 vitest 用例写法，需人工验证后再动。
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
